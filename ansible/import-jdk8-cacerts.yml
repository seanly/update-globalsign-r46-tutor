---
# Import GlobalSign Root R46 into private JDK 8 cacerts files.
# A cacerts symlink to /etc/pki/java/cacerts is skipped; that file belongs to
# update-ca-trust and is replaced the next time the system trust store is rebuilt.
#
#   ansible-playbook -i inventory ansible/import-jdk8-cacerts.yml
#   ansible-playbook -i inventory ansible/import-jdk8-cacerts.yml -e cacerts_pass=changeit
#
# Log in as root, or add -b. Already-root SSH can use -e ansible_become=false.
# Check mode is not supported. Running Java processes must be restarted.

- name: Import GlobalSign Root R46 into JDK 8 cacerts
  hosts: all
  gather_facts: false
  become: true
  serial: "{{ batch_size | default(100) }}"
  tasks:
    - name: Import the pinned root into each JDK 8 keystore
      ansible.builtin.raw: "printf %s {{ lookup('file', playbook_dir + '/files/import-jdk8-cacerts.sh') | b64encode }} | base64 -d | CERT_B64={{ lookup('file', playbook_dir + '/../packages/centos6/sources/globalsign-root-r46.crt') | b64encode }} CACERTS_PASS='{{ cacerts_pass | default('changeit') }}' bash"
      register: import_cmd
      changed_when: import_cmd.stdout is search('(?m)^imported ')
